name: magic_pods
description: "MagicPods - AirPods & Bluetooth Headphone Manager for Windows"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  # Windows System Tray
  tray_manager: ^0.2.3
  
  # Window Management
  window_manager: ^0.4.3

  # Audio Control (Windows)
  win32audio: any

  # Win32 APIs for native Windows access
  win32: ^5.10.0
  ffi: ^2.1.3

  # Text-to-Speech
  flutter_tts: ^4.2.0

  # Local Storage
  shared_preferences: ^2.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Enhancements
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0

  # Hotkey
  hotkey_manager: ^0.2.3

  # Path
  path_provider: ^2.1.5
  path: ^1.9.1

  # Utilities
  equatable: ^2.0.7
  intl: ^0.20.2
  logger: ^2.5.0
  collection: ^1.19.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

